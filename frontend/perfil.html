<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediRed IPS · Mi perfil</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="barra">
    <div class="barra-superior">
      <span class="marca">MediRed <small>IPS</small></span>
      <div class="persona">
        <span><strong id="nombre-usuario"></strong> <span class="rol" id="rol-usuario"></span></span>
        <button id="cerrar-sesion" type="button">Cerrar sesión</button>
      </div>
    </div>
    <nav id="menu" aria-label="Secciones"></nav>
  </header>

  <main>
    <div class="cabecera-seccion">
      <div>
        <h1>Mi perfil</h1>
        <p class="resumen">Sus datos, tal como los tiene ms-usuarios.</p>
      </div>
    </div>
    <dl class="ficha-perfil" id="perfil"></dl>
    <p class="nota">Para cambiar estos datos o su contraseña, pida ayuda al administrador.</p>
  </main>
  <div id="mensajes"></div>
  <dialog id="dialogo"></dialog>

  <script src="js/config.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/perfil.js"></script>
</body>
</html>
